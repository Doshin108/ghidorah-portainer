version: '3.8'
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Detroit
      - VERSION=latest
      - PLEX_CLAIM=claim-3EL6DK9y6k5_JV9hwYWJ
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - VERSION=docker
      - ADVERTISE_IP=http://10.0.0.10:32400/  
    ports:
      - 10.0.0.10:32400:32400 
    restart: unless-stopped
